global:
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'telegram-default'

  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

  routes:
    - match:
        severity: critical
        service: app
      receiver: 'telegram-critical'
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 30m

    - match:
        severity: warning
        service: app
      receiver: 'telegram-warning'
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h

receivers:
  - name: 'telegram-default'
    telegram_configs:
      - api_url: https://api.telegram.org
        bot_token: 'ваш токен'
        chat_id: 0
        parse_mode: 'HTML'
        message: '{{ template "telegram.default" . }}'
        send_resolved: true

  - name: 'telegram-critical'
    telegram_configs:
      - api_url: https://api.telegram.org
        bot_token: 'ваш токен'
        chat_id: 0
        parse_mode: 'HTML'
        message: '{{ template "telegram.critical" . }}'
        send_resolved: true

  - name: 'telegram-warning'
    telegram_configs:
      - api_url: https://api.telegram.org
        bot_token: 'ваш токен'
        chat_id: 0
        parse_mode: 'HTML'
        message: '{{ template "telegram.warning" . }}'
        send_resolved: true