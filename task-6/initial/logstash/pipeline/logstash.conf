input {
	beats {
	    port => 5044
	    host => "0.0.0.0"
      ssl => false
      client_inactivity_timeout => 3600
  	}
}

output {
	elasticsearch {
		hosts => ["elasticsearch:9200"]
		manage_template => false
    	index => "%{[@metadata][beat]}-%{[@metadata][version]}-%{+YYYY.MM.dd}"
    timeout => 300
    retry_initial_interval => 10
    retry_max_interval => 60
    retry_on_conflict => 3
	}

    stdout { codec => rubydebug }
}