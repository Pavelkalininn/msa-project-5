spring.datasource.url=jdbc:postgresql://postgresdb:5432/productsdb
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.batch.jdbc.initialize-schema=always
spring.jpa.hibernate.ddl-auto=create-drop
spring.batch.jdbc.table-prefix=BATCH_

management.endpoints.web.exposure.include=beans,env,health,info,metrics,mappings,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true

management.health.mail.enabled=false
management.metrics.enable.spring=true
management.metrics.enable.batch=true

spring.batch.job.name=importProductJob

spring.main.web-application-type=servlet

spring.batch.job.enabled=false


logging.level.com.ivanfranchin.moviesapi=DEBUG

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.application.name=batch-processing
server.port=8080