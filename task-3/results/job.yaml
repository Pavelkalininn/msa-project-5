apiVersion: batch/v1
kind: CronJob
metadata:
  name: price-list-generator
spec:
  schedule: "44 * * * *"  # Каждый день в 6:00
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: exporter
            image: accounts-exporter:latest  # Локальный образ
            imagePullPolicy: IfNotPresent
            env:
            - name: DB_HOST
              value: "dev-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "dcmsportal"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: OUTPUT_DIR
              value: "/app/output"
            volumeMounts:
            - name: output-volume
              mountPath: /app/output
          volumes:
          - name: output-volume
            persistentVolumeClaim:
              claimName: price-list-pvc
          restartPolicy: OnFailure